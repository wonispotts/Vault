    font-family: sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .grid img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    transition: transform 0.2s ease;
  }
  .grid img:hover {
    transform: scale(1.03);
  }
</style>
