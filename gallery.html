<!DOCTYPE html>
<html lang="en">

<title>Vault Gallery</title>
<style>
  body {
    background: #111;
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .grid img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .grid img:hover {
    transform: scale(1.03);
  }
  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: zoom-out;
  }
  #lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="grid">

function closeLightbox() {
