<!DOCTYPE html>

<style>
  body {
    background: #111;
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
  }

  /* ---- Uniform grid: fixed-size cells, strict row-by-row order, no zigzag ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }

  .item {
    overflow: hidden;
    border-radius: 8px;
  }
  .item img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .item img:hover {
    transform: scale(1.03);
  }

  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    overflow: hidden;
  }
  #lightbox-stage {
    position: relative;
    width: 90%;
    height: 78%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    transform-origin: center center;
  }
  #lightbox-caption {
    color: #fff;
    font-size: 1.15rem;
    margin-top: 14px;
  }
  #lightbox-counter {
    color: #999;
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .lb-close {
    position: absolute;
    top: 18px; right: 28px;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    z-index: 1001;
  }
  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 2.5rem;
    cursor: pointer;
    padding: 10px 16px;
    user-select: none;
    z-index: 1001;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
  }
  .lb-arrow:hover { background: rgba(0,0,0,0.6); }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }
</style>

<div id="lightbox">
  <div class="lb-close" id="lbClose">&times;</div>
  <div class="lb-arrow" id="lb-prev">&#10094;</div>
  <div id="lightbox-stage">
    <img id="lightbox-img" src="">
  </div>
  <div class="lb-arrow" id="lb-next">&#10095;</div>
  <div id="lightbox-caption"></div>
  <div id="lightbox-counter"></div>
</div>

<script>
const grid = document.getElementById('galleryGrid');
const items = Array.from(grid.querySelectorAll('.item'));
const images = items.map(item => item.querySelector('img'));

// ---- Lightbox ----
let currentIndex = 0;
let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbCaption = document.getElementById('lightbox-caption');
const lbCounter = document.getElementById('lightbox-counter');

function resetZoom() {
  scale = 1; panX = 0; panY = 0;
  lbImg.style.transform = `translate(0px,0px) scale(1)`;
}

function showImage(index) {
  currentIndex = (index + images.length) % images.length;
  const img = images[currentIndex];
  lbImg.src = img.src;
  lbCaption.textContent = img.dataset.caption;
  lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  resetZoom();
}

images.forEach((img, i) => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showImage(i);
  });
});

document.getElementById('lb-next').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex + 1);
});
document.getElementById('lb-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex - 1);
});
document.getElementById('lbClose').addEventListener('click', () => {
  lightbox.style.display = 'none';
});

document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
  if (e.key === 'Escape') lightbox.style.display = 'none';
});

// scroll to zoom
lbImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(1, scale), 5);
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});

// drag to pan
lbImg.addEventListener('mousedown', (e) => {
  if (scale === 1) return;
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  lbImg.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.style.cursor = 'grab';
});
</script>
