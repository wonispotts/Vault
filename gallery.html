<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vault Gallery</title>
<style>
  body {
    background: #111;
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* change to repeat(5, 1fr) for 5 per row */
    gap: 14px;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }

  .item {
    aspect-ratio: 7 / 10;
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .item img:hover {
    transform: scale(1.02);
  }

  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    align-items: center;
    justify-content: center;
    z-index: 999;
    overflow: hidden;
  }

  /* Row layout: image stage on the left, caption panel on the right */
  #lightbox-content {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 92%;
    height: 86%;
    max-width: 1400px;
    gap: 28px;
  }

  #lightbox-stage {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    transform-origin: center center;
  }

  /* Caption sidebar */
  #lightbox-sidebar {
    flex: 0 0 340px;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #lightbox-caption {
    color: #ffffff;
    font-size: 1rem;
    line-height: 1.7;
    text-align: justify;
    
   
    hyphens: auto;
    max-height: 62vh;
    overflow-y: auto;
    padding-right: 12px;
    white-space: pre-line;
  }
  #lightbox-counter {
    color: #666;
    font-size: 0.85rem;
    margin-top: 14px;
  }

  @media (max-width: 800px) {
    #lightbox-content {
      flex-direction: column;
      width: 92%;
      height: 90%;
      gap: 14px;
    }
    #lightbox-stage {
      flex: 1 1 55%;
    }
    #lightbox-sidebar {
      flex: 0 1 auto;
      max-width: 100%;
    }
    #lightbox-caption {
      max-height: 22vh;
    }
  }

  .lb-close {
    position: absolute;
    top: 18px; right: 28px;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    z-index: 1001;
  }
  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 2.5rem;
    cursor: pointer;
    padding: 10px 16px;
    user-select: none;
    z-index: 1001;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
  }
  .lb-arrow:hover { background: rgba(0,0,0,0.6); }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }
</style>
</head>
<body>

<div class="grid" id="galleryGrid">
  <div class="item"><img data-caption="For centuries, agriculturists born in bondage toiled to create fertile fields of gold." src="images/01. FROM THE SOIL.png"></div>
  <div class="item"><img data-caption="Negro cloth, a traditional attire designed for the enslaved. The Boston Manufacturing Company stitched a coarse fabric as a symbol of bondage and status. Factories depended on cotton and Indigofera tinctoria plants, “blue gold” harvested and processed on plantations by the enslaved. A uniform of oppression soared to the heights of fashion around the globe." src="images/02. NEGRO CLOTH.png"></div>
  <div class="item"><img data-caption="Black Americans emerged through ethnogenesis in North America, with haplogroups from Europe, maternal-H, U, K, T, paternal-R1b, I, J, North America, maternal-A, B, C, D, paternal-Q, Africa, maternal-L, paternal-E1b1a/E-V38, and Asia, Oceania, paternal-M, O, from Ancestral Australo-Melanesians, “Manila Men” in Louisiana, and Malagasies genetics. On plantations, procreation produced bi-racial and tri-racial progeny, while waves of Europeans, Christianized Ancestral Australo-Melanesians, Beringian descendants, and Free People of Color—by birth or independent liberation—formed tri-racial isolates. Emerged through ethnogenesis in North America, with haplogroups from five to six continents, the emancipated used the names of hidden ancestors—colonists—famous figures, Biblical heroes, geographical places, and later, Afrocentric, Arabic, and Hebrew identifiers. Free People of Color developed cultures in tri-racial isolates:Cheswold Moors, Mitsawoketts, Nanticokes, Lenni-Lenapes, Melungeons, Ramps, Dominikers, Montauks, Mantinecocks, Van Guilders, Poospatucks, Lumbees, Croatans, Clappers, Shinnecocks, Waccamaws, Haliwas, Redbones, Buckheads, Yellowhammers, Creoles, Cajuns, Ramapos/Ramapoughs, Jackson Whites, Narragansetts, Gay Heads, Powhatans, Mashpees, Carmelites, Piscataway Conoy, Guineas, Turks, Pooles, Chickahominy, Smilings, Charvises, Creels, Brass Ankles, Redlegs, Rapides, St. Landry Mulattoes, Zwolle-Ebards, Bushwhackers, Rockingham Surry Group, Vinton County Group, Darke County Group, Keating Mountain Group, Karthus Half-Breeds, Saponis/Sapponys, Upper Mattaponis, Patawomecks, Rappahannocks, N-Hill People…

https://wonispotts.github.io/Vault/ethnicity.pdf" src="images/03. ETHNO.png"></div>
  <div class="item"><img data-caption="Spoken all over the planet, the Black American dialect expressed complex concepts with fewer words. Traced to the Caspian Steppe, proto-Indo-European language evolved into Old English, c. 450-1,150 CE. Characterized as outsiders, the Black American collective inherited the genetics of European colonists to affect Middle to Modern English, c. 1,150–1,700 CE, with Gullah Geechee, Louisiana Creole, Afro-Seminole Creole, and Tutnese—a secret language spoken by the enslaved. Europeans in North America shifted from Scandinavian, Slavic, and Romance languages to English. South American, Central American, Asian, Oceanian, Middle Eastern, African, and Caribbean countries speak official European languages. Indigenous African, Greek, Turkic, Scandinavian, Russian, and Hebrew speakers use English to conduct international business. Velvet vocal resonances produced celebrated singers, DJs, rappers, orators, and narrators in advertisements, documentaries, television, and cinema—Roots, Star Wars… The New Cab Calloway's Cat-ologue: A Hepster's Dictionary, c. 1,939 CE. Jazz artists added depth to English and foretold future music genres—Hip-Hop, Rock, Funk... Lester Young, a legendary saxophonist, used “cool” to signify a calm and collected state of mind." src="images/04. LINGUISTICS.png"></div>
  <div class="item"><img data-caption="Hundreds of revolts, escapes, and mutinies changed politics with the rise of abolitionists and activists—Frederick Douglass, Harriet Tubman, Sojourner Truth, Robert Smalls, Dred Sam Scott, Nat Turner, William Wells Brown, Paul Cuffee, William Howard Day, Charlotte Forten Grimke, Frances Ellen Watkins Harper, Lewis Hayden, Josiah Henson, Paul Jennings, Katherine Brown, Charlotte L. Brown, Robert Fox, Elizabeth Jennings Graham, Ida B. Wells, Booker T. Washington... 

Abolitionists—Elizabeth Freeman, Quock Walker, and Prince Hall in Pennsylvania, Massachusetts, Vermont, New Hampshire, Connecticut, and Rhode Island, gradually self-emancipated and led abolition movements, c. 1, 700 CE.

Harriet Tubman: Born enslaved, abolitionist, nurse, educator, scout, spy, and famous Underground Railroad conductor.

Sojourner Truth: Born enslaved, abolitionist, civil rights leader, women's rights leader, and temperance activist.

Robert Smalls: Born enslaved, a naval hero known for a heroic escape amidst the Civil War, and elected to the U.S. Congress from South Carolina, c. 1,875–1,879 CE.

Dred Sam Scott: Born enslaved, sued for freedom in the Dred Scott v. Sandford case or the Dred Scott Decision. The United States Supreme Court held that the U.S. Constitution did not extend American citizenship to Black Americans.

Nat Turner: Born enslaved, carpenter, preacher, and led a four-day rebellion in Southampton County, Virginia.

Ida B. Wells: Born enslaved, civil rights leader, investigative journalist, educator, and one of the founders of the National Association for the Advancement of Colored People.

Booker Taliaferro Washington: Born enslaved, prominent leader, educator, author, orator, and philanthropist.

Rosa Louise McCauley Parks: Civil rights activist, challenged bus segregation which led to the Montgomery bus boycott." src="images/06. ABOLITION.png"></div>
  <div class="item"><img data-caption="Railroad companies used the enslaved to lay over 10,000 miles of train tracks in the South and East, compared to 700 miles of rail laid in the West by paid foreign laborers. Later, emancipated leased laborers constructed train tracks in the Midwest and North. Black Americans patented railroad lubricants and mechanical devices, notably the famous 'Real McCoy'inventions. Country musicians learned techniques to pick guitars and to sing from Black American railroad workers." src="images/07. RAILROAD.png"></div>
  <div class="item"><img data-caption="The explosive growth from agricultural wealth led to the development of ports, railroads, and urban areas, built by Black American architects, craftsmen, and laborers—Wallace A. Rayfield, John A. Lankford, George Washington Foster, Vertner Woodson Tandy, Julian Francis Abele, Paul Revere Williams, Clarence W. 'Cap' Wigington, and Benjamin Banneker." src="images/08. FOUNDATIONAL CITIES.png"></div>
  <div class="item"><img data-caption="Black Americans served honorably in North American wars—War of 1812—Free Men of Color or Black Loyalists, The Civil War—United States Colored Troops and auxiliary—400,000, Indian Wars—Buffalo Soldiers, Spanish-American War—Buffalo Soldiers, WWI—Harlem Hellfighters—369 Infantry Regiment, and WWII—Tuskegee Airmen, winners of precursor to 'Top Gun' contest. Private Willie Duckworth, a Black American WWII soldier, created a cadence, the Duckworth Chant, 'Sound Off!'"src="images/09. MILITARY USCT.png"></div>
  <div class="item"><img data-caption="The Buffalo Soldiers constructed national parks, protected settlers, stagecoaches, wagon trains, and railroads. Regiments patrolled, paved roads, drew maps, blazed trails, fought fires, and removed livestock, rustlers, poachers, and loggers." src="images/10. MILITARY BUFFALO.png"></div>
  <div class="item"><img data-caption="Two hundred thousand protestors in major cities—New York, Chicago, and Detroit—protested in support of Ethiopia and fought against the Italian invasion of Ethiopia, c. 1,935 CE. John Charles Robinson, the “Brown Condor," volunteered to fight Italian forces as a commander in the Ethiopian Air Force. Tuskegee Airmen, won the precursor to “Top Gun” contest." src="images/11. MILITARY TUSK.png"></div>
  <div class="item"><img data-caption="Against a backdrop of the open range, humble ranch hands tended herds, rode horses, and roped cattle on drives. On the rugged Western frontier, the status of 'cowboy' carried a word to emasculate, 'boy.' The status of 'cattleman' exuded authority. Tales of charismatic lawmen and cowboys mesmerized the country. European descendant actors assumed the identities of charismatic Freedmen cowboys on the silver screen. In the end, halls of fame inducted folkloric Black American cowboys." src="images/12. COWBOYS.png"></div>
  <div class="item"><img data-caption="Formalized May 30, 1868, to honor fallen soldiers, the origins of Decoration Day trace back to May 1, 1865, in Charleston, South Carolina. Black Americans and missionaries reinterred deceased Union soldiers from a Confederate prison camp. In a show of respect, thousands built a fence, marked graves, accented with flowers, and held a parade under the Martyrs of the Race Course arch. The United States of America established Memorial Day in 1966." src="images/13. MEMORIAL DAY.png"></div>
  <div class="item"><img data-caption=" " src="images/14. GRACE WISHER.png"></div>
  <div class="item"><img data-caption="Emma Lazarus, a descendant of Judaic exiles and exploitative sugar plantation owners in Recife, Brazil, a Dutch colony. The Lazarus business partnered with Bradish Johnson, an enslaver and plantation owner in Louisiana. Emma Lazarus composed a sonnet, which challenged the original symbolism of the Statue of Liberty. Constance Cary Harrison, a Confederate nurse, and William Maxwell Evarts, a Unionist sympathetic to Confederate interests, embraced Emma Lazarus. Southerners resented the monument, a memorial of the Civil War victory and the Emancipation Proclamation. "Give me your tired, your poor, your huddled masses yearning to breathe free…" -The New Colossus." src="images/15. STATUE OF LIBERTY.png"></div>
  <div class="item"><img data-caption="The legacy of chattel slavery left a legion of barriers to break down and a labyrinth of obstacles to rise above. After the Emancipation Proclamation, Reconstruction Era politicians, from senators to police chiefs, ascended as powerful civil rights advocates. A symbol of the future and a threat to the old guard, Black Americans sought to reshape government with humanitarian-centered politicians. The emancipated suffered cross-burnings, medical apartheid, convict leasing, a collapsed Freedman’s Bank, desecrated cemeteries, lynch mobs, race riots—Paragould, Tulsa—Black Wall Street, East St. Louis, Ocoee… and massacres—Ebenezer Creek, Devil’s Punchbowl, Elaine-Red Summer, Colfax, Wilmington, North Carolina, Atlanta, Elaine Arkansas, Rosewood… The gains over the Reconstruction Period vanished." src="images/16. RECONSTRUCTION.png"></div>
  <div class="item"><img data-caption="Since the end of the Civil War and the Great Migration, the emancipated thrived in cities, suburbs, and rural settings in every state. Racial terrorism, gentrification, and reckless immigration policies destabilized Black American enclaves nationally. Crumpled newspapers hold the evidence of property destruction and genocide.

Tulsa’s Greenwood District, Oklahoma: Known as Black Wall Street, a prosperous economic center before the race massacre.

Harlem, New York: An epicenter for artist movements—Harlem Renaissance.

Seneca Village: A community of Black American landowners, later demolished to create Central Park.

Washington, D.C.’s Shaw: A vibrant history of culture and activism.

Chicago’s Bronzeville: Historic nightlife and cultural center.

Richmond’s Jackson Ward, Virginia: An economic and cultural district known for Black American businesses.

New Orleans’ Tremé: Historic Black American enclave, rich in music heritage.

Baltimore’s Upton: Historic center for civil rights and art.

St. Louis’ The Ville: Historic universities and culture.

Philadelphia’s Germantown: Rich in history, landmarks, and political activism.

Detroit’s Black Bottom: Historic center with cultural landmarks.

Los Angeles’ Leimert Park: A modern, artistic, and historic center for Black American culture.

Oakland’s West Oakland: Famous for Black American civil rights activism.

Atlanta’s Sweet Auburn District: A Black American historic and cultural landmark." src="images/17. WALL STREET.png"></div>
  <div class="item"><img data-caption=" " src="images/18. HBCU.png"></div>
  <div class="item"><img data-caption="Black Americans attended 101+ HBCUs and registered 50,000+ patents, c. 1,800-1,900 CE. Ingenious inventions, innovations, and achievements in agriculture, mechanics, medicine, architecture, technology, science, mathematics, astronomy, and NASA's race to space moved the United States of America forward. https://wonispotts.github.io/Vault/Inventions.pdf" src="images/19. INVENTIONS.png"></div>
  <div class="item"><img data-caption="C. R. Patterson & Sons Cars: Designed automobiles superior to Henry Ford's mass-produced Model T. Born enslaved, c. 1,833 CE, Charles Richard Patterson escaped a Virginia plantation, trained as a blacksmith, and settled in Greenfield, Ohio. C.R. Patterson & Sons of Greenfield, Ohio, manufactured and repaired carriages, trucks, and buses." src="images/20. CARS.png"></div>
  <div class="item"><img data-caption="Since companies declined to pay salaries, guests “tipped” Black American workers. A. Philip Randolph headed a Black union—the Brotherhood of Sleeping Car Porters. Low wages and poor conditions led to a labor strike. After cities were paralyzed, the government created Labor Day and raised pay as a gesture of good faith, c. 1,882 CE." src="images/21. PULLMEN PORTER.png"></div>
  <div class="item"><img data-caption="Born out of a tradition of segregated leagues, Black Americans broke barriers in over fifty sports and competitions. From Olympic podiums to boxing rings, rodeo arenas, tennis courts, and NASCAR tracks, champions exuded humility and class. A mystique formed around power salutes, stare-downs, confident struts, insider handshakes, and activism. https://wonispotts.github.io/Vault/Sports.pdf" src="images/22. SPORTS.png"></div>
  <div class="item"><img data-caption=" " src="images/23. EXPLORER.png"></div>
  <div class="item"><img data-caption="Black Americans spend billions on luxury travel annually. On the international stage, Black American philanthropy shone through schools, churches, and charitable concerts—We Are The World. The historic presence of elite segregated armed forces, united with iconic performances by Olympians, artists, and entertainers, built a stellar reputation across the planet." src="images/24. TRAVEL.png"></div>
  <div class="item"><img data-caption="On the stage, flappers danced, dolled up with silky ringlets of baby hair. 

Entrepreneur, philanthropist, and social activist, Madam C.J. Walker built a hair-care and cosmetics empire. 

As an act of rebellion against Eurocentric beauty standards, afros crowned kings and queens. Braids graced disco divas and inspired the blockbuster film 10. The Commodores' “Brick House“ and Sir Mix-a-Lot's “Baby Got Back” celebrated natural hair, sensual curves, brown skin, and full lips. James Brown's “Say it Loud, I’m Black, and I’m Proud” and activist chants “Black is Beautiful” and “Black Power” championed pride." src="images/25. HAIR BEAUTY SALON.png"></div>
  <div class="item"><img data-caption="Since antiquity in the Americas, wild game, flavored by wood ash, wild onion, sassafras, or sumac, braised in hickory oil, and nut milk—cooked over open fires. In bondage, children stoked labor-intensive 24-hour fires and smoked meats guided by elder 'pitmasters' on plantations. Barbecue halls of fame awarded Black Americans for grill techniques, woods, flavors, and traditions." src="images/26. FOOD BBQ.png"></div>
  <div class="item"><img data-caption="Cherished crops—the seeds of soul food, thrived in harsh weather, rose from diverse soils, and echoed boundless strength and survival. From stark slave quarters to stately plantation kitchens, agricultural geniuses raised chickens, cultivated plants, honed culinary techniques, and crafted a unique world-class cuisine. Chefs published the first cookbooks—Hotel Keepers, Head Waiters, and Housekeepers’ Guide, Tunis Campbell, c. 1,848 CE. A Domestic Cook Book, Malinda Russell, c. 1,866 CE, and What Mrs. Fisher Knows About Old Southern Cooking, Abby Fisher, c. 1,881 CE. LeRoi Jones coined the term “soul food,” which described a collection of dishes mastered for half a millennium, c. 1,962 CE. 
                      
Europeans imported collard greens, okra, watermelon, and black-eyed peas to the Americas and exported peanuts, along with tomatoes—species native to the Americas—to Africa.

Far from a global flatbread, cornbread elevated maize as a leavened savory cake. Artisans crafted leavened biscuits, gravy, mashed potatoes, pastry dough, and meats fried in seasoned batter.

Middle English defined animal intestines as “chitterlings.” Peasants in medieval Europe consumed the whole pig, while commodified captives turned pork scraps—chitlins, feet, ears, and knuckles—from sows’ ears into silk purses.

Willed to Thomas Jefferson, James Hemings, “The Father of Macaroni and Cheese,” apprenticed in France, perfected cheeses, sauces, meringues…, and reigned as the first master chef in America.

https://wonispotts.github.io/Vault/Cuisine.pdf" src="images/27. FOOD SOUL.png"></div>
  <div class="item"><img data-caption="For nearly a century, Jim Crow laws oppressed Black Americans exclusively. Throughout the era, visitors of all races used exemption badges, pins, and documentation to enter facilities and establishments restrictive to Black Americans. Turbans were worn to feign foreignness. A Texas slave, William Ellis, assumed the name “Guillermo Eliseo,” “passed,” learned Spanish, and evaded segregation. While foreigners of African descent dined in restaurants, Black Americans, notably, Olympic gold medalist Muhammad Ali stood outside. Ali tossed an Olympic gold medal into the Ohio River to protest an incident. United Nations Secretary-General Kofi Annan, a Ghanaian, encountered a barber exclaiming, “I do not cut n—er hair.” Kofi Annan replied, “I am not a n—er. I am an African.” Kofi Annan's haircut commenced." src="images/28. DINER.png"></div>
  <div class="item"><img data-caption="  " src="images/29. ICE CREAM TRUCK.png"></div>
  <div class="item"><img data-caption="  " src="images/30. BEACH.png"></div>
  <div class="item"><img data-caption="Country events highlight fairs, farmer's markets, cowboys, and line dance cultures." src="images/31. COUNTRY FAIR.png"></div>
  <div class="item"><img data-caption="In the Civil Rights era, Black American skaters protested with skate-ins to protest segregated rinks.

Darlene Anderson, the first Black professional roller derby skater……" src="images/32. ROLLER RINK.png"></div>
  <div class="item"><img data-caption="Dolls, animal figurines, and folded paper—cootie catchers, fortune tellers— spark creativity, role play, and strategy. Bicycles, roller skates, and skateboards encourage independence, physical strength, coordination, and exploration. Jump ropes, jacks, paddleballs, Clackers/Klik Klaks, hand claps/Patty Cake rhymes develop stamina, hand-eye, coordination, and teamwork.

Ancient images show woven ropes used by Australians, Egyptians, Chinese, Phoenicians, and medieval Europeans for games and crafts.

Black American children in Philadelphia, Chicago, Baltimore, and Washington D.C. developed speed variations, footwork, rhythmic jumps, choreography, and chants timed to jumps. Two NYPD officers—David A. Walker and Ulysses Williams—created leagues, tournaments, and official rules for Double Dutch. Rhythmic alternatives to drums—hambone, patty-cake-style claps, and rhymes—Miss Mary Mack…developed.

Hopscotch originated from ancient Roman and Greek games and agility exercises." src="images/33. STREET GAMES.png"></div>
  <div class="item"><img data-caption="Before Blaxploitation films, technological geniuses and cinematic icons, Black Americans stood at the forefront of entertainment. The Edison Company developed the Projectoscope, which used carbon filament invented by Lewis Latimer. Berlinger, Columbia, and Thomas Edison recorded Black Americans, c. 1,890 CE. “Something Good-Negro Kiss” c. 1,898 CE, portrayed Black American life with tender romantic scenes. Born to a father enslaved by French Huguenots, Oscar Micheaux shined as one of the first Black American filmmakers. The Golden Age of Black Hollywood created superstars—Josephine Baker, Lena Horne, Eartha Kitt, Pearl Bailey, Dorothy Dandridge, Theresa Harris, Katherine Dunham, Joyce Bryant, Nia Mae McKinney, Ruby Dee, Ossie Davis, Paul Robeson, and Diahann Carroll. Blaxploitation films emerged in the 1970s as a genre centered Black actors and urban stories." src="images/34. DRIVE IN MOVIE.png"></div>
  <div class="item"><img data-caption="Inspired by a black panther symbol, liberation politics, and the concept of militant self-defense of the Lowndes County Freedom Organization, Alabama, Huey Percy Newton and Bobby Seale founded the Black Panther Party in Oakland, California, c. 1,966 CE. The concept globalized with the Dalit Panthers, Polynesian Panthers, and the Australian Black Panther Party." src="images/35. BLACK PANTHERS.png"></div>
  <div class="item"><img data-caption="The first mention of Low Riders appeared in the article 'Stolen Car Parts Seized, Hot-Rod Gang Arrested.' -California Eagle, Los Angeles, May 30, 1957. In 1963, Victor Murphy exhibited adjustable suspension, 'hopping,' craftsmanship installed by Bill Hines of Lynwood, California. Al 'Old Man' Sullivan produced hydraulic masterpieces from a shop located near Crenshaw Boulevard and 8th Street, Los Angeles, California. Athen Nelson engineered 'three-wheel motion,' where one rear wheel lifts while the opposite front and rear wheels remain grounded. Low Rider Hall of Fame: Ted Wells, Tina L. Blankenship-Early, Gary May… The band WAR recorded the culture into history with 'Lowrider' in 1975." src="images/36. LOWRIDERS.png"></div>
  <div class="item"><img data-caption="As the heartbeat of humanitarianism, the emancipated moved around obstacles on a tightrope. On the international stage, Black American philanthropy shone through schools, churches, and charitable concerts—We Are The World. The historic presence of segregated armed forces, united with iconic performances by Olympians, artists, and entertainers, established an honorable reputation across the planet. 
                      
https://wonispotts.github.io/Vault/humanitarianism.pdf" src="images/37. HUMANITARIANS.png"></div>
  <div class="item"><img data-caption="Performers tapped across the silver screen—the Nicolas Brothers, Bill "Bojangles" Robinson, and John W. Bubbles, Fred Astaire’s mentor. Partiers buck danced, boogie-woogied, cakewalked, jitterbugged, jooked, and jived.

As Dance crazes swept the world, flappers Charlestoned and acrobatics shone through Swing Dancers and Lindy hoppers. Hips rocked and rolled to the Twist. Stars from the cosmos fell and spun glittery balls over Discotheques. In the streets and on the Soul Train line, Hip-Hop produced urban dances—Breakers, B-Boyers, Boogalooers, Pop-Lockers, Turfers, Krumpers, and Crip Walkers. Stylized moves developed—Robot, Worm, Jerk, Centipede, Cabbage Patch, Dougie, Humpty, Moonwalk, Hammertime, and HBCU Marching." src="images/38. DANCE TAP.png"></div>
  <div class="item"><img data-caption="  " src="images/39. COTTON CLUB.png"></div>
  <div class="item"><img data-caption="Harlem Jazz Clubs in the 1930s featured Black Americans in Zoot suits." src="images/40. HARLEM.png"></div>
  <div class="item"><img data-caption="A sanctuary from the storm, churches acted as spaces to share plant medicine, education, and music. On fertile grounds, congregants cultivated economic cooperation, political activism, and legal advocacy.

  In symbolic marriage ceremonies, enslaved couples “jumped the broom.” The hands of midwives delivered the vulnerable into harsh environments, while elders prepared older children for harsh realities through “the talk.” Black Americans kept the names of hidden ancestors—colonists—famous figures, Biblical heroes, geographical places, and later, Afrocentric, Arabic, and Hebrew identifiers." src="images/41. CHURCH.png"></div>
  <div class="item"><img data-caption="Black American men in pompadours, wavy conks, and lined-up cuts harmonized in barbershop quartets. Unique Quartette, “Mamma’s Black Baby Boy,” c. 1,893 CE, and Dinwiddie Colored Quartet, “Down At The Old Camp Ground,” c. 1,902 CE. https://wonispotts.github.io/Vault/music.pdf" src="images/42. MUSIC BARERSHOP.png"></div>
  <div class="item"><img data-caption="Before the Country genre, enslaved folk musicians developed a distinct down-stroke—clawhammer or frailing technique on stringed instruments exclusively handmade by Black Americans, c. 1,600-1,800 CE. Phil Jamison's book Hoedowns, Reels, and Frolics: Roots and Branches of Southern Appalachian Dance discovered archival evidence of Black American dance callers, hoedowns, square dances, fiddlers, and banjo players in the Southern Appalachia, c. 1,690-1,800 CE. European descendant Americans mocked Black Americans in minstrel shows and later adopted the traditions. Artists painted the enslaved as musicians, 'The Old Plantation,' John Rose, c. 1,785 CE. https://wonispotts.github.io/Vault/music.pdf" src="images/43. MUSIC COUNTRY.png"></div>
  <div class="item"><img data-caption="https://wonispotts.github.io/Vault/music.pdf" src="images/44. MUSIC BLUES.png"></div>
  <div class="item"><img data-caption="https://wonispotts.github.io/Vault/music.pdf" src="images/45. MUSIC JAZZ.png"></div>

Born in Nigeria, under British colonial rule, Fela Kuti traveled to New York for musical inspiration and discovered “Blackness.” The Nigerian musician fused the rhythms of James Brown, the improvisation of Miles Davis, and the soul of Motown with Highlife and Yoruba percussion. Sailors and British colonists in Africa, introduced brass instruments and Black American jazz. “I started out playing Highlife and was the first tomodernize it with Rock, Jazz, and R&B. It was Afrobeat, but my record company called it Afro-Soul.” -Orlando Owoh Julius. The name “Highlife” originated from aristocratic audiences and exclusive clubs." src="images/51. MUSIC INTERNATIONAL.png"></div>

By the mid-twentieth century, manufacturers globalized, millions of workers lost jobs, neighborhoods spiraled, and the media magnified scenes of urban decay. Out of the spotlight, waves of coal mine closures in Appalachia left a wasteland of drug-fueled lawlessness.

To keep affluent property values high, authorities distort data, refuse to press charges, reduce charges, grant early release, permit theft—Proposition 47—and fail to report crime to the FBI. Newtown, Connecticut, reported zero murders after twenty-six students and staff were massacred. Statistics show a 2% incarceration rate for males of European descent, contrasted by a 4% incarceration rate for Black males, with a 50% exoneration rate among the 4%.

<div id="lightbox">
  <div class="lb-close" id="lbClose">&times;</div>
  <div class="lb-arrow" id="lb-prev">&#10094;</div>
  <div id="lightbox-content">
    <div id="lightbox-stage">
      <img id="lightbox-img" src="">
    </div>
    <div id="lightbox-sidebar">
      <div id="lightbox-caption"></div>
      <div id="lightbox-counter"></div>
    </div>
  </div>
  <div class="lb-arrow" id="lb-next">&#10095;</div>
</div>

<script>
const grid = document.getElementById('galleryGrid');
const items = Array.from(grid.querySelectorAll('.item'));
const images = items.map(item => item.querySelector('img'));

let currentIndex = 0;
let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbCaption = document.getElementById('lightbox-caption');
const lbCounter = document.getElementById('lightbox-counter');

function resetZoom() {
  scale = 1; panX = 0; panY = 0;
  lbImg.style.transform = `translate(0px,0px) scale(1)`;
}

function showImage(index) {
  currentIndex = (index + images.length) % images.length;
  const img = images[currentIndex];
  lbImg.src = img.src;
  lbCaption.textContent = img.dataset.caption;
  lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  resetZoom();
}

images.forEach((img, i) => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showImage(i);
  });
});

document.getElementById('lb-next').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex + 1);
});
document.getElementById('lb-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex - 1);
});
document.getElementById('lbClose').addEventListener('click', () => {
  lightbox.style.display = 'none';
});

document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
  if (e.key === 'Escape') lightbox.style.display = 'none';
});

lbImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(1, scale), 5);
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});

lbImg.addEventListener('mousedown', (e) => {
  if (scale === 1) return;
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  lbImg.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.style.cursor = 'grab';
});
</script>
