<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vault Gallery</title>
<style>
  body {
    background: #111;
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }

  .item {
    border-radius: 8px;
  }
  .item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .item img:hover {
    transform: scale(1.02);
  }

  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    align-items: center;
    justify-content: center;
    z-index: 999;
    overflow: hidden;
  }

  /* Row layout: image stage on the left, caption panel on the right */
  #lightbox-content {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 92%;
    height: 86%;
    max-width: 1400px;
    gap: 28px;
  }

  #lightbox-stage {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    transform-origin: center center;
  }

  /* Caption sidebar */
  #lightbox-sidebar {
    flex: 0 0 340px;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #lightbox-caption {
    color: #7a7a7a;
    font-size: 1rem;
    line-height: 1.7;
    text-align: justify;
    text-align-last: justify;
    -moz-text-align-last: justify;
    hyphens: auto;
    max-height: 62vh;
    overflow-y: auto;
    padding-right: 12px;
  }
  #lightbox-counter {
    color: #666;
    font-size: 0.85rem;
    margin-top: 14px;
  }

  @media (max-width: 800px) {
    #lightbox-content {
      flex-direction: column;
      width: 92%;
      height: 90%;
      gap: 14px;
    }
    #lightbox-stage {
      flex: 1 1 55%;
    }
    #lightbox-sidebar {
      flex: 0 1 auto;
      max-width: 100%;
    }
    #lightbox-caption {
      max-height: 22vh;
    }
  }

  .lb-close {
    position: absolute;
    top: 18px; right: 28px;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    z-index: 1001;
  }
  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 2.5rem;
    cursor: pointer;
    padding: 10px 16px;
    user-select: none;
    z-index: 1001;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
  }
  .lb-arrow:hover { background: rgba(0,0,0,0.6); }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }
</style>
</head>
<body>

<div class="grid" id="galleryGrid">

Malagasies genetics.
On plantations, procreation produced bi-racial and
tri-racial progeny, while waves of Europeans,
Christianized Ancestral Australo-Melanesians,
Beringian descendants, and Free People of Color—
by birth or independent liberation—formed tri-racial

Beringian descendants and Black Americans
marched on the Trail of Tears to Oklahoma. The

  <div class="item"><img data-caption="Spoken all over the planet, the Black American dialect expressed complex concepts with fewer words. Traced to the Caspian Steppe, proto-Indo-European language evolved into Old English, c. 450-1,150 CE. Characterized as outsiders, the Black American collective inherited the genetics of European colonists to affect Middle to Modern English, c. 1,150–1,700 CE, with Gullah Geechee, Louisiana Creole, Afro-Seminole Creole, and Tutnese—a secret language spoken by the enslaved. Europeans in North America shifted from Scandinavian, Slavic, and Romance languages to English. South American, Central American, Asian, Oceanian, Middle Eastern, African, and Caribbean countries speak official European languages. Indigenous African, Greek, Turkic, Scandinavian, Russian, and Hebrew speakers use English to conduct international business. Velvet vocal resonances produced celebrated singers, DJs, rappers, orators, and narrators in advertisements, documentaries, television, and cinema—Roots, Star Wars… The New Cab Calloway's Cat-ologue: A Hepster's Dictionary, c. 1,939 CE. Jazz artists added depth to English and foretold future music genres—Hip-Hop, Rock, Funk... Lester Young, a legendary saxophonist, used “cool” to signify a calm and collected state of mind." src="images/04. LINGUISTICS.png"></div>

<div id="lightbox">
  <div class="lb-close" id="lbClose">&times;</div>
  <div class="lb-arrow" id="lb-prev">&#10094;</div>
  <div id="lightbox-content">
    <div id="lightbox-stage">
      <img id="lightbox-img" src="">
    </div>
    <div id="lightbox-sidebar">
      <div id="lightbox-caption"></div>
      <div id="lightbox-counter"></div>
    </div>
  </div>
  <div class="lb-arrow" id="lb-next">&#10095;</div>
</div>

<script>
const grid = document.getElementById('galleryGrid');
const items = Array.from(grid.querySelectorAll('.item'));
const images = items.map(item => item.querySelector('img'));

let currentIndex = 0;
let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbCaption = document.getElementById('lightbox-caption');
const lbCounter = document.getElementById('lightbox-counter');

function resetZoom() {
  scale = 1; panX = 0; panY = 0;
  lbImg.style.transform = `translate(0px,0px) scale(1)`;
}

function showImage(index) {
  currentIndex = (index + images.length) % images.length;
  const img = images[currentIndex];
  lbImg.src = img.src;
  lbCaption.textContent = img.dataset.caption;
  lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  resetZoom();
}

images.forEach((img, i) => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showImage(i);
  });
});

document.getElementById('lb-next').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex + 1);
});
document.getElementById('lb-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex - 1);
});
document.getElementById('lbClose').addEventListener('click', () => {
  lightbox.style.display = 'none';
});

document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
  if (e.key === 'Escape') lightbox.style.display = 'none';
});

lbImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(1, scale), 5);
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});

lbImg.addEventListener('mousedown', (e) => {
  if (scale === 1) return;
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  lbImg.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.style.cursor = 'grab';
});
</script>

</body>
</html>
