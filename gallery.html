<style>
  body {
    background: #111;
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }

  .item {
    border-radius: 8px;
  }
  .item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }
  .item img:hover {
    transform: scale(1.02);
  }

  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    align-items: center;
    justify-content: center;
    z-index: 999;
    overflow: hidden;
  }

  /* Row layout: image stage on the left, caption panel on the right */
  #lightbox-content {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 92%;
    height: 86%;
    max-width: 1400px;
    gap: 28px;
  }

  #lightbox-stage {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    transform-origin: center center;
  }

  /* Caption sidebar */
  #lightbox-sidebar {
    flex: 0 0 340px;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #lightbox-caption {
    color: #ffffff;
    font-size: 1rem;
    line-height: 1.7;
    text-align: justify;
    text-align-last: justify;
    -moz-text-align-last: justify;
    hyphens: auto;
    max-height: 62vh;
    overflow-y: auto;
    padding-right: 12px;
  }
  #lightbox-counter {
    color: #666;
    font-size: 0.85rem;
    margin-top: 14px;
  }

  @media (max-width: 800px) {
    #lightbox-content {
      flex-direction: column;
      width: 92%;
      height: 90%;
      gap: 14px;
    }
    #lightbox-stage {
      flex: 1 1 55%;
    }
    #lightbox-sidebar {
      flex: 0 1 auto;
      max-width: 100%;
    }
    #lightbox-caption {
      max-height: 22vh;
    }
  }

  .lb-close {
    position: absolute;
    top: 18px; right: 28px;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    z-index: 1001;
  }
  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 2.5rem;
    cursor: pointer;
    padding: 10px 16px;
    user-select: none;
    z-index: 1001;
    background: rgba(0,0,0,0.3);
    border-radius: 6px;
  }
  .lb-arrow:hover { background: rgba(0,0,0,0.6); }
  #lb-prev { left: 12px; }
  #lb-next { right: 12px; }
</style>

  <div class="item"><img data-caption="Black Americans emerged through ethnogenesis in
North America, with haplogroups from Europe,
maternal-H, U, K, T, paternal-R1b, I, J, North
America, maternal-A, B, C, D, paternal-Q, Africa,
maternal-L, paternal-E1b1a/E-V38, and Asia,

Malagasies genetics.
On plantations, procreation produced bi-racial and
tri-racial progeny, while waves of Europeans,
Christianized Ancestral Australo-Melanesians,
Beringian descendants, and Free People of Color—
by birth or independent liberation—formed tri-racial
isolates.
Beringian descendants and Black Americans
marched on the Trail of Tears to Oklahoma. The
Cherokee Nation broke the Treaty of 1866, which
promised tribal citizenship for Cherokee Freedmen
and an end to slavery. In tri-racial and quad-racial
isolates, Free People of Color and non-English
Europeans coalesced on ancestral lands under the
threat of violence or enslavement.
A proponent of the “one drop rule,” Walter A. Plecker
compiled a surname blacklist to reclassify races on
birth certificates." src="images/03. ETHNO.png"></div>
  <div class="item"><img data-caption="Spoken all over the planet, the Black American dialect expressed complex concepts with fewer words. Traced to the Caspian Steppe, proto-Indo-European language evolved into Old English, c. 450-1,150 CE. Characterized as outsiders, the Black American collective inherited the genetics of European colonists to affect Middle to Modern English, c. 1,150–1,700 CE, with Gullah Geechee, Louisiana Creole, Afro-Seminole Creole, and Tutnese—a secret language spoken by the enslaved. Europeans in North America shifted from Scandinavian, Slavic, and Romance languages to English. South American, Central American, Asian, Oceanian, Middle Eastern, African, and Caribbean countries speak official European languages. Indigenous African, Greek, Turkic, Scandinavian, Russian, and Hebrew speakers use English to conduct international business. Velvet vocal resonances produced celebrated singers, DJs, rappers, orators, and narrators in advertisements, documentaries, television, and cinema—Roots, Star Wars… The New Cab Calloway's Cat-ologue: A Hepster's Dictionary, c. 1,939 CE. Jazz artists added depth to English and foretold future music genres—Hip-Hop, Rock, Funk... Lester Young, a legendary saxophonist, used “cool” to signify a calm and collected state of mind." src="images/04. LINGUISTICS.png"></div>
  <div class="item"><img data-caption="Hundreds of revolts, escapes, and mutinies changed
politics with the rise of abolitionists and activists—
Frederick Douglass, Harriet Tubman, Sojourner
Truth, Robert Smalls, Dred Sam Scott, Nat Turner,
William Wells Brown, Paul Cuffee, William Howard
Day, Charlotte Forten Grimke, Frances Ellen Watkins
Harper, Lewis Hayden, Josiah Henson, Paul
Jennings, Katherine Brown, Charlotte L. Brown,
Robert Fox, Elizabeth Jennings Graham, Ida B. Wells,
Booker T. Washington...
Abolitionists—Elizabeth Freeman, Quock Walker,
and Prince Hall in Pennsylvania, Massachusetts,
Vermont, New Hampshire, Connecticut, and Rhode
Island, gradually self-emancipated and led abolition
movements, c. 1, 700 CE.
Harriet Tubman
Born enslaved, abolitionist, nurse, educator, scout,
spy, and famous Underground Railroad conductor.
Sojourner Truth
Born enslaved, abolitionist, civil rights leader,
women's rights leader, and temperance activist.
Robert Smalls
Born enslaved, a naval hero known for a heroic
escape amidst the Civil War, and elected to the U.S.
Congress from South Carolina, c. 1,875–1,879 CE.
Dred Sam Scott
Born enslaved, sued for freedom in the Dred Scott v.
Sandford case or the Dred Scott Decision. The United
States Supreme Court held that the U.S. Constitution
did not extend American citizenship to Black
Americans.
Nat Turner
Born enslaved, carpenter, preacher, and led a four-
day rebellion in Southampton County, Virginia.
William Wells Brown
Born enslaved, abolitionist, novelist, playwright,
and historian.
Ida B. Wells
Born enslaved, civil rights leader, investigative
journalist, educator, and one of the founders of the
National Association for the Advancement of
Colored People.
Booker Taliaferro Washington
Born enslaved, prominent leader, educator, author,
orator, and philanthropist.
Lewis Hayden
Born enslaved, abolitionist, lecturer, businessman,
and politician.
Josiah Henson
Born enslaved, abolitionist, author, and minister.
Paul Cuffee
Born free, abolitionist, businessman, sea captain,
whaler, Black American and Wampanoag.
William Howard Day
Born free, abolitionist, editor, educator, and
minister.
Charlotte Forten Grimke
Born free, abolitionist, poet, and educator.
Frances Ellen Watkins Harper
Born free, abolitionist, suffragist, educator, author,
poet, orator, and temperance activist.
Paul Jennings
Born enslaved by President James Madison,
abolitionist, and published the first White House
memoir, c. 1,865 CE.
Katherine Brown
Challenged railroad segregation after a violent
encounter. Railroad Company v. Brown, c. 1,873 CE,
and U.S. Senate, c. 1,868 CE. The Supreme Court for
the District of Columbia held that white and Black
American passengers must be treated with equality
in the use of the railroad's cars.
Rosa Louise McCauley Parks
Civil rights activist, challenged bus segregation
which led to the Montgomery bus boycott. The
United States Congress honored Parks as "The first
lady of civil rights" and "the mother of the freedom
movement.”
Charlotte L. Brown, Robert Fox, and Elizabeth
Jennings Graham challenged segregation on public
transportation successfully.
Before Black History Month, Dr. Martin Luther King
Jr. Day, and Juneteenth, emancipated South
Carolinians were early celebrants of Memorial Day,
c. 1865 CE. A. Philip Randolph headed a Black union
—the Brotherhood of Sleeping Car Porters. Low
wages and poor conditions led to a labor strike.
After cities were paralyzed, the government created
Labor Day and raised pay as a gesture of good faith,
c. 1,882 CE." src="images/06. ABOLITION.png"></div>

  <div class="item"><img data-caption="Black Americans served honorably in North American wars—War of 1812—Free Men of Color or Black Loyalists, The Civil War—United States Colored Troops and auxiliary—400,000, Indian Wars—Buffalo Soldiers, Spanish-American War—Buffalo Soldiers, WWI—Harlem Hellfighters—369 Infantry Regiment, and WWII—Tuskegee Airmen, winners of precursor to 'Top Gun' contest. Private Willie Duckworth, a Black American WWII soldier, created a cadence, the Duckworth Chant, 'Sound Off!'" src="images/09. MILITARY USCT.png"></div>

  <div class="item"><img data-caption="Emma Lazarus, a descendant of Judaic exiles and exploitative sugar plantation owners in Recife, Brazil, a Dutch colony. The Lazarus business partnered with Bradish Johnson, an enslaver and plantation owner in Louisiana. Emma Lazarus composed a sonnet, which challenged the original symbolism of the Statue of Liberty. Constance Cary Harrison, a Confederate nurse, and William Maxwell Evarts, a Unionist sympathetic to Confederate interests, embraced Emma Lazarus. Southerners resented the monument, a memorial of the Civil War victory and the Emancipation Proclamation. 'Give me your tired, your poor, your huddled masses yearning to breathe free…' -The New Colossus." src="images/15. STATUE OF LIBERTY.png"></div>

  <div class="item"><img data-caption="Cherished crops—the seeds of soul food, thrived in
harsh weather, rose from diverse soils, and echoed
boundless strength and survival.
From stark slave quarters to stately plantation
kitchens, agricultural geniuses raised chickens,
cultivated plants, honed culinary techniques, and
crafted a unique world-class cuisine.
Chefs published the first cookbooks—Hotel Keepers,
Head Waiters, and Housekeepers’ Guide, Tunis
Campbell, c. 1,848 CE. A Domestic Cook Book,
Malinda Russell, c. 1,866 CE, and What Mrs. Fisher
Knows About Old Southern Cooking, Abby Fisher, c.
1,881 CE.
LeRoi Jones coined the term “soul food,” which
described a collection of dishes mastered for half a
millennium, c. 1,962 CE.
Collard greens appeared in ancient Greece, 800 BCE.
Egyptians and Ethiopians recorded the early use of
okra, and later, Europeans wrote of okra in West
Africa and watermelon in Northeast Africa.
Europeans imported collard greens, okra,
watermelon, and black-eyed peas to the Americas
and exported peanuts, along with tomatoes—species
native to the Americas—to Africa.
Rice cultivation began in China, c. 7,000 BCE, and in
Africa, c. 2,000 BCE. In isolated regions unrelated to
the masses, the Gullah Geechee cultivated Carolina
Gold Rice and preserved remnants of African
religions, folklore, and crafts.
Far from a global flatbread, cornbread elevated
maize as a leavened savory cake. Artisans crafted
leavened biscuits, gravy, mashed potatoes, pastry
dough, and meats fried in seasoned batter.
Middle English defined animal intestines as
“chitterlings.” Peasants in medieval Europe
consumed the whole pig, while commodified
captives turned pork scraps—chitlins, feet, ears, and
knuckles—from sows’ ears into silk purses.
Since antiquity in the Americas, wild game, flavored
by wood ash, wild onion, sassafras, or sumac,
braised in hickory oil, and nut milk—cooked over
open fires. In bondage, children stoked labor-
intensive 24-hour fires and smoked meats guided by
elder “pitmasters” on plantations. Barbecue halls of
fame awarded Black Americans for grill techniques,
woods, flavors, and traditions.
Archaeology shows an independent evolution of
cheese production in ancient Egypt, Mesopotamia,
Greece, Rome, and the Indus Valley. Medieval Italy
documented the use of flour to craft pasta noodles.
Willed to Thomas Jefferson, James Hemings, “The
Father of Macaroni and Cheese,” apprenticed in France,
perfected cheeses, sauces, meringues…, and reigned
as the first master chef in America.
Chef and restaurateur, George Speck or Crum, fried
potatoes into "Saratoga chips.” George Washington
Carver innovated over three hundred uses for
peanuts.
Augustus Jackson, a White House chef, enhanced ice
cream. Nathan "Nearest" Green, a master distiller,
mentored Jack Daniel. Richard “Dickie” Wells, owner
of Wells Supper Club in Harlem, paired waffles with
fried chicken. Biscuits, gravy, battered meats,
ground peanuts, dressed poultry, pastries,
fermentation, and distillation originated in ancient
Egypt, Greece, and Rome.
Thanksgiving evolved from North American harvest
festivals. Cranberries, corn, beans, and pumpkins,
paired with European feasts centered on stuffed
poultry and gravy. Soul food celebrated, innovated,
and elevated the elements of seasonal holidays.
In Afrocentric mythology, women sensed seizure
and tucked dried okra seeds into coiled braids.
While the captured lay covered in the filth of
dungeons, African guards chained limbs, shaved
heads, and violated bodies. After brutal months-long
voyages, spirits dimmed on Caribbean islands. As
the weary passengers touched Louisiana shores,
seeds slipped from bare scalps into fertile soil, and
gumbo emerged.
European traders adapted the words okra and
gumbo from Ila in Yoruba, ọ ́ kụ ̀ rụ ̀ in Igbo, kingombo in
Bantu. Okra or ground sassafras leaf, kombo/kompo in
Choctaw, filé in French, thickened gumbos, soups,
and stews in Louisiana Creole cuisine. Portuguese,
Spanish, and French culinary traditions surfaced in
the Americas—gumbo, paella, jambalaya, and
French colonial Africa—thieboudienne/ceebu jën/jollof
rice.
In West Africa, the French used broken rice from
Indochina into Africa to replace Oryza glaberrima
with Oryza sativa. Faced with a shortage of barley,
Penda Mbaye, a Wolof/Waalo-Waalo cook for a
colonial governor, prepared thieboudienne/ceebu jën/
jollof rice. Before colonization, West and Central
Africans combined bushmeat, insects, reptiles, fish,
vegetables and flavors, fermented locust beans,
oilseeds, potash, Guinea pepper, and red palm oil in
single vessels—one-pots, c. <500–1,000 CE.
Academics overlooked Black Americans and
bestowed the concept of soul food on Africans,
based on okra, an East African vegetable, and black-
eyed peas imported from West Africa by Europeans.
In stark contrast, Europeans designed cuisines and
desserts around tomatoes and cacao, absent the
obligation to praise ancients in the Americas. Black
Americans transformed ingredients from the
Americas into the distinctive cuisine—soul food.
Historians wove folktales around chefs assembled
near a cast-iron cauldron. After Portuguese traders
visited a lavish Louisiana estate, the French stirred
the roux. In the moment, Choctaws infused sassafras
flavor, while Spaniards drizzled olive oil into the
African-simmered okra. Once the work of fiction
faded under the light, culture bearers with an
ancestral mosaic appeared—Black American
Creoles.
Descendants of the British Isles rebranded soul
food as “Southern cuisine.” In the book Notes from a
Young Black Chef: A Memoir, West African Chef
Kwame Onwuachi connected West Africa to soul
food. Foreign-owned restaurants serve African and
Caribbean dishes described as soul food. In Europe,
Africa, and the Caribbean, historians recorded
cuisines outside the scope of soul food traditions.
Homage to Soul Food
Hushed voices mingled as a sleepy sun rose over the
Deep South. From the corners of America, four
generations crossed the threshold into an ancestral
home. Family and friends united to celebrate,
preserve, and cook traditional soul food.
Around the kitchen, garden gems glistened under
the water. Wise hands trimmed, chopped, and
marinated the leaves in an elixir of smoke, vinegar,
olive oil, garlic, salt, and pepper. With the flames on
low, a slow quintet of pots boiled the collard greens,
black-eyed peas, pinto beans, snapped green beans,
and rice. Nearby, a cast-iron pan baked cornbread
batter into the color of rich amber.
Bold and unapologetic, chitterlings presented an
earthiness reminiscent of the tilled land toiled by the
ancestors. Once cleaned, the innards boiled for hours
in a broth of garlic, onions, vinegar, salt, and hot
pepper. The complex nature heightened as a second
wave of spices followed. Behind the malodor, the
laborious booty settled into a one-of-a-kind aroma,
enhanced by a shot of hot sauce.
Dough kneaded and cut into rounds, baked into
flaky biscuits. Silky gravy formed from flour
thickened with roasted meat juices, sautéed
mushrooms, herbs, onions, salt, and pepper.
As the water rippled and swirled, potatoes
surrendered to the boil. Once cooled, chopped, and
headed for parallel fates, some whipped into creamy,
fluffy clouds of mashed potatoes. Others blended
into potato salad with a medley of chopped boiled
eggs, mayonnaise, relish, and mustard, finished with
a sprinkle of salt and pepper.
When the batter hit the hot oil, hisses, pops, and
crackles built excitement in separate heavy pots.
Whispers of thyme, basil, and celery met the roars of
paprika, garlic, onion, and pepper. Mustard and salt
cut through to a ginger undercurrent. The first
savory crunch of crisp, fried chicken and fish hinted
at the tender succulence hidden beneath.
The drama unfolded as bland macaroni pasta baked,
bubbled, and melded with velvety cheeses into a
bronzed, crisp-topped crescendo—a symbol of
comfort amidst the chaos in a spectacle of textures.
Outside, the grill smoldered under the hall-of-fame
barbecue chef’s critical gaze. Exotic smoke billowed
in the air as wood chips—hickory, oak, mesquite,
and a touch of applewood—burned. When heat
from the wood rose, the barbecue chef used hand-
crafted dry rubs and secret sauces for prime cuts
with aphrodisiacal flavors and superb sears.
Leaves blazed in sepia shades of crimson, gold, and
sienna. Sweet potatoes bathed in luxurious maple,
butter, brown sugar, and spices—brewed into a
caramelized potion. Tart cranberries softened by
cinnamon, nutmeg, and cloves, invited a breath of
vanilla to round the center. Orange zest and a splash
of lemon juice danced around the fringes. Beneath
the cobbler’s gilded glazed crust, juice from
harvested fruit erupted. The cornucopia captured
the abundance of fall. Palms pressed and folded the
supple dough. A wooden pin rolled away the rough
borders. Below the scalloped edges, a delicate
auburn potato whip rested.
Ambient sweet potatoes melded into a crumbly
pastry. The interplay unlocked seasonal memories,
an aftereffect. Inside the oven, cubes of dried bread,
dusted with herbs and sautéed with onions, celery,
garlic, salt, and pepper, absorbed the juices from a
sun-burnished bird.
Sounds of laughter from loved ones moved closer
and closer to the grand table. An ornate brass and
crystal chandelier illuminated the room. Soft glows
cast chance shadows to set the scene. High-glossed
bowls held stacks of layered biscuits, gossamer puffs
of mashed potatoes, and spirals of silkened gravy.
Beige button-tufted chairs lined up to the plates,
silverware, glasses, and linen napkins.
In a trio of enamelware, fried chicken, infused with
four-dimensional herbs and spices, balanced the cool
character of potato salad and the fiery temperament
of barbecue.
Across the table, earthy greens and pearls of rice
accented the mounds of beans and odorous
chitterlings. Slices from the stuffed turkey lay
fanned out on a polished platter. Hot cornbread
radiated the scent of toasted butter downwind.
Macaroni and cheese, crowned with an umbered
crust, added to the ambrosial mosaic. With lemons
squeezed and fruit punched, glass pitchers poured
icy drinks.
Coffee and desserts—autumnal-themed sweet
potato pies, fruit cobblers, and tart cranberries
replaced the empty spaces. The clock stopped, spun
backward, and then forward as a wide lens closed" src="images/27. FOOD SOUL.png"></div>

  <div class="item"><img data-caption="Inspired by a black panther symbol, liberation politics, and the concept of militant self-defense of the Lowndes County Freedom Organization, Alabama, Huey Percy Newton and Bobby Seale founded the Black Panther Party in Oakland, California, c. 1,966 CE. The concept globalized with the Dalit Panthers, Polynesian Panthers, and the Australian Black Panther Party." src="images/35. BLACK PANTHERS.png"></div>

<div id="lightbox">
  <div class="lb-close" id="lbClose">&times;</div>
  <div class="lb-arrow" id="lb-prev">&#10094;</div>
  <div id="lightbox-content">
    <div id="lightbox-stage">
      <img id="lightbox-img" src="">
    </div>
    <div id="lightbox-sidebar">
      <div id="lightbox-caption"></div>
      <div id="lightbox-counter"></div>
    </div>
  </div>
  <div class="lb-arrow" id="lb-next">&#10095;</div>
</div>

<script>
const grid = document.getElementById('galleryGrid');
const items = Array.from(grid.querySelectorAll('.item'));
const images = items.map(item => item.querySelector('img'));

let currentIndex = 0;
let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbCaption = document.getElementById('lightbox-caption');
const lbCounter = document.getElementById('lightbox-counter');

function resetZoom() {
  scale = 1; panX = 0; panY = 0;
  lbImg.style.transform = `translate(0px,0px) scale(1)`;
}

function showImage(index) {
  currentIndex = (index + images.length) % images.length;
  const img = images[currentIndex];
  lbImg.src = img.src;
  lbCaption.textContent = img.dataset.caption;
  lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
  resetZoom();
}

images.forEach((img, i) => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showImage(i);
  });
});

document.getElementById('lb-next').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex + 1);
});
document.getElementById('lb-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex - 1);
});
document.getElementById('lbClose').addEventListener('click', () => {
  lightbox.style.display = 'none';
});

document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
  if (e.key === 'Escape') lightbox.style.display = 'none';
});

lbImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(1, scale), 5);
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});

lbImg.addEventListener('mousedown', (e) => {
  if (scale === 1) return;
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
  lbImg.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  lbImg.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.style.cursor = 'grab';
});
</script>
