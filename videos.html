<div id="lightbox">
  <div class="lb-close" id="lbClose">&times;</div>
  <div class="lb-arrow" id="lb-prev">&#10094;</div>
  <div id="lightbox-content">
    <div id="lightbox-stage">
      <video id="lightbox-video" controls playsinline></video>
    </div>
    <div id="lightbox-sidebar">
      <div id="lightbox-caption"></div>
      <div id="lightbox-counter"></div>
    </div>
  </div>
  <div class="lb-arrow" id="lb-next">&#10095;</div>
</div>

<script>
const grid = document.getElementById('galleryGrid');
const items = Array.from(grid.querySelectorAll('.item'));
const thumbs = items.map(item => item.querySelector('video'));

// Thumbnails use preload="metadata" so the file loads fast, but some browsers
// leave the frame blank until told where to look. Seeking a fraction of a
// second in forces a visible frame to paint as a "poster" for the grid.
thumbs.forEach(video => {
  video.addEventListener('loadedmetadata', () => {
    try { video.currentTime = 0.1; } catch (e) {}
  }, { once: true });
});

let currentIndex = 0;

const lightbox = document.getElementById('lightbox');
const lbVideo = document.getElementById('lightbox-video');
const lbCaption = document.getElementById('lightbox-caption');
const lbCounter = document.getElementById('lightbox-counter');

function showVideo(index) {
  currentIndex = (index + thumbs.length) % thumbs.length;
  const video = thumbs[currentIndex];
  const src = video.querySelector('source').src;
  lbVideo.pause();
  lbVideo.src = src;
  lbVideo.currentTime = 0;
  lbVideo.play().catch(() => {});
  lbCaption.textContent = video.dataset.caption;
  lbCounter.textContent = (currentIndex + 1) + ' / ' + thumbs.length;
}

function closeLightbox() {
  lbVideo.pause();
  lbVideo.removeAttribute('src');
  lbVideo.load();
  lightbox.style.display = 'none';
}

items.forEach((item, i) => {
  item.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showVideo(i);
  });
});

document.getElementById('lb-next').addEventListener('click', (e) => {
  e.stopPropagation();
  showVideo(currentIndex + 1);
});
document.getElementById('lb-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  showVideo(currentIndex - 1);
});
document.getElementById('lbClose').addEventListener('click', closeLightbox);

document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') showVideo(currentIndex + 1);
  if (e.key === 'ArrowLeft') showVideo(currentIndex - 1);
  if (e.key === 'Escape') closeLightbox();
});
</script>
